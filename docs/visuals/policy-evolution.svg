<svg xmlns="http://www.w3.org/2000/svg" width="1050" height="360" viewBox="0 0 1050 360" role="img" aria-labelledby="title desc">
<title id="title">Policy graph evolution</title><desc id="desc">Cold-start policy graph evolves through SME-reviewed diffs and metrics.</desc>
<defs><style>.bg{fill:#0b1020}.card{fill:#111a33;stroke:#31416f;stroke-width:2;rx:16}.node{fill:#192c56;stroke:#75a7ff;stroke-width:2;rx:12}.add{fill:#132f27;stroke:#43d39e}.warn{fill:#322719;stroke:#ffc857}.txt{font-family:Inter,Arial,sans-serif;fill:#edf3ff}.muted{fill:#a8b8d9;font-size:13px}.h{font-size:21px;font-weight:700}.b{font-size:15px;font-weight:700}.arrow{stroke:#8bbcff;stroke-width:3;fill:none;marker-end:url(#a)}</style><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#8bbcff"/></marker></defs>
<rect class="bg" width="1050" height="360"/><text class="txt h" x="34" y="45">Cold-start GenAI policy evolution</text>
<rect class="card" x="35" y="80" width="215" height="210"/><text class="txt b" x="60" y="116">v0.1 Skeleton</text><rect class="node" x="65" y="140" width="150" height="36"/><text class="txt muted" x="86" y="163">GA.root</text><rect class="node" x="65" y="190" width="150" height="36"/><text class="txt muted" x="83" y="213">visual artifacts</text><rect class="node" x="65" y="240" width="150" height="36"/><text class="txt muted" x="89" y="263">boundaries</text>
<path class="arrow" d="M252 185 L315 185"/>
<rect class="card" x="320" y="80" width="215" height="210"/><text class="txt b" x="345" y="116">Round 0 labels</text><rect class="warn" x="350" y="145" width="150" height="42"/><text class="txt muted" x="379" y="170">LLM split</text><rect class="warn" x="350" y="205" width="150" height="42"/><text class="txt muted" x="372" y="230">SME override</text>
<path class="arrow" d="M537 185 L600 185"/>
<rect class="card" x="605" y="80" width="215" height="210"/><text class="txt b" x="630" y="116">Suggested diff</text><rect class="add" x="635" y="140" width="150" height="36"/><text class="txt muted" x="650" y="163">+ new subtype</text><rect class="add" x="635" y="190" width="150" height="36"/><text class="txt muted" x="648" y="213">+ hard negative</text><rect class="add" x="635" y="240" width="150" height="36"/><text class="txt muted" x="657" y="263">+ examples</text>
<path class="arrow" d="M822 185 L885 185"/>
<rect class="card" x="890" y="80" width="125" height="210"/><text class="txt b" x="913" y="116">SME</text><text class="txt muted" x="918" y="158">approve</text><text class="txt muted" x="927" y="190">or</text><text class="txt muted" x="920" y="222">reject</text><text class="txt muted" x="906" y="258">with reason</text>
</svg>
