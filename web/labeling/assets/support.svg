<text x="73" y="224" font-family="Georgia,serif" font-size="61" fill="#304e45">You do not</text><text x="73" y="303" font-family="Georgia,serif" font-size="61" fill="#304e45">have to carry</text><text x="73" y="382" font-family="Georgia,serif" font-size="61" fill="#304e45">this alone.</text>
